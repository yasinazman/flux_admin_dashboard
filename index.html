<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-light d-flex align-items-center justify-content-center vh-100">
        <div class="card shadow-sm p-4 login-card">
            <div class="card-body">

                <div class="text-center mb-3">
                    <div class="bg-warning text-black rounded-circle d-inline-flex align-items-center justify-content-center login-logo">
                        <i class="fa-solid fa-bolt fa-2x"></i>
                    </div>
                </div>

                <h3 class="text-center text-black mb-4 fw-bold">Flux Admin</h3>
                
                <div id="loginError" class="alert alert-danger d-none" role="alert">
                    Invalid username or password!
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter 'admin'" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter '1234'" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Login</button>
                </form>
                
                <div class="mt-3 text-center">
                    <small class="text-muted">Test Credentials: <strong>admin</strong> / <strong>1234</strong></small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
